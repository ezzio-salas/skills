name: Update Agent Native visual skills

on:
  workflow_dispatch:
    inputs:
      sourceSha:
        description: "Agent Native commit SHA or ref to sync from"
        required: false
        type: string
        default: main
  repository_dispatch:
    types: [agent-native-plan-skills-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-agent-native-plan-skills
  cancel-in-progress: true

env:
  UPDATE_BRANCH: automation/update-agent-native-plan-skills

jobs:
  update:
    name: Refresh visual-plan and visual-recap
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.BUILDER_BOT_FOR_LINT_APP_ID }}
          private-key: ${{ secrets.BUILDER_BOT_FOR_LINT_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: BuilderIO/agent-native
          ref: ${{ github.event.client_payload.sourceSha || inputs.sourceSha || 'main' }}
          path: .agent-native-source

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Sync visual skills from Agent Native
        env:
          AGENT_NATIVE_FRAMEWORK_PATH: ${{ github.workspace }}/.agent-native-source
        run: npm run sync:agent-native-plan-skills

      - name: Detect visual skill changes
        id: diff
        run: |
          if git diff --quiet -- skills/visual-plan skills/visual-recap; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close stale update PR
        if: steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          pr_number="$(gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // ""')"
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" \
              --comment "No Agent Native visual skill updates remain; closing this stale updater PR." \
              --delete-branch
          fi
          echo "Visual skills are already current."

      - name: Check synced visual skills
        if: steps.diff.outputs.changed == 'true'
        env:
          AGENT_NATIVE_FRAMEWORK_PATH: ${{ github.workspace }}/.agent-native-source
        run: npm run check

      - name: Commit update branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "builder-bot"
          git config user.email "builder-bot@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add skills/visual-plan skills/visual-recap
          git commit -m "chore: update Agent Native visual skills"
          git push --force-with-lease origin "$UPDATE_BRANCH"

      - name: Open or update PR
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.sourceRepository || 'BuilderIO/agent-native' }}
          SOURCE_SHA: ${{ github.event.client_payload.sourceSha || inputs.sourceSha || 'main' }}
          SOURCE_RUN_URL: ${{ github.event.client_payload.sourceRunUrl }}
        run: |
          cat > /tmp/update-visual-skills-pr.md <<EOF
          This automated PR syncs \`visual-plan\` and \`visual-recap\` from Agent Native.

          Source:
          - Repository: \`$SOURCE_REPOSITORY\`
          - Ref: \`$SOURCE_SHA\`
          ${SOURCE_RUN_URL:+- Workflow: $SOURCE_RUN_URL}

          Check run before opening/updating this PR:
          - \`npm run check\`

          **Review required before merge.** \`npm run check\` validates
          frontmatter and that the synced file list and contents match the
          source. It does not review what the content says. Skill Markdown is
          executable instruction for an agent, so read this diff as code:

          - Instructions that send repo content to a network destination.
          - Instructions that read credentials, \`.env\` files, or private data.
          - Invisible or bidirectional Unicode hiding text from this diff view.
          - New commands, especially ones run without confirmation.
          EOF

          pr_number="$(gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // ""')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "chore: update Agent Native visual skills" \
              --body-file /tmp/update-visual-skills-pr.md
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "chore: update Agent Native visual skills" \
              --body-file /tmp/update-visual-skills-pr.md
            pr_number="$(gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Summarize pending review
        if: steps.diff.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          {
            echo "## Visual skills update awaiting review"
            echo
            echo "PR #${PR_NUMBER} syncs visual-plan and visual-recap."
            echo
            echo "This PR is **not** merged automatically. \`npm run check\`"
            echo "verifies frontmatter and that the synced files match the"
            echo "source; it does not review what the content says."
            echo
            echo "Skill Markdown is executable instruction for an agent, so a"
            echo "human reviews the content before it reaches main."
            echo
            echo '```'
            git diff --stat "origin/${BASE_BRANCH}" -- skills/visual-plan skills/visual-recap
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
